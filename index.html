<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Continue</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

    :root {
      --blue: #008CFF;
      --dark: #191919;
      --white: #ffffff;
      --surface: #f7f7f7;
      --muted: #767676;
      --border: #e0e0e0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--white);
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px max(40px, env(safe-area-inset-bottom));
      text-align: center;
    }

    .icon {
      width: 80px; height: 80px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }
    .icon svg { width: 38px; height: 38px; }

    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -.02em;
      line-height: 1.15;
      margin-bottom: 12px;
      color: var(--dark);
    }

    p {
      font-size: .95rem;
      color: var(--muted);
      line-height: 1.55;
      max-width: 300px;
      margin: 0 auto 40px;
    }

    .btn {
      display: block;
      width: 100%; max-width: 360px;
      padding: 18px;
      background: var(--blue);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: .01em;
      touch-action: manipulation;
      -webkit-appearance: none;
      box-shadow: 0 8px 28px rgba(0,140,255,.28);
      transition: transform .12s, box-shadow .12s;
      animation: pulse 3s 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 8px 28px rgba(0,140,255,.28); }
      50%      { box-shadow: 0 10px 40px rgba(0,140,255,.45); }
    }
    .btn:active { transform: scale(.97); }

    .note {
      margin-top: 18px;
      font-size: .74rem;
      color: var(--muted);
    }
    .note::before { content: '✓ '; color: var(--blue); font-weight: 800; }
  </style>
</head>
<body>

<div class="page">

  <div class="icon">
    <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="19" cy="19" r="19" fill="#008CFF" fill-opacity=".12"/>
      <path d="M13 19h12M19 13l6 6-6 6" stroke="#008CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>One more step</h1>
  <p>Tap below to continue in your browser.</p>

  <button class="btn" id="continueBtn">CONTINUE</button>
  <div class="note">Opens in Safari / Chrome</div>

</div>

<script>
(function () {
  var DEST = 'https://supersamed.pro';

  var btn = document.getElementById('continueBtn');

  btn.addEventListener('click', function () {
    var ua = navigator.userAgent;

    if (/Android/i.test(ua)) {
      var u = new URL(DEST);
      location.href = 'intent://' + u.host + u.pathname + u.search + u.hash
        + '#Intent;scheme=https;package=com.android.chrome;'
        + 'S.browser_fallback_url=' + encodeURIComponent(DEST) + ';end';

    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      location.href = DEST.replace(/^https:/, 'x-safari-https:');
      setTimeout(function () { location.href = DEST; }, 900);

    } else {
      location.href = DEST;
    }
  });
})();
</script>

</body>
</html>
